server.port=8080
spring.config.import=optional:file:.env[.properties]

# Cấu hình Supabase Connection Pooler (Port 6543)
# Cấu hình Supabase Connection Pooler (Port 6543)
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USERNAME}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate tự động cập nhật bảng
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

supabase.url=${SUPABASE_URL}
supabase.key=${SUPABASE_SERVICE_ROLE_KEY:}

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=51MB
supabase.bucket=${SUPABASE_STORAGE_BUCKET:book_prices}
supabase.ebooks-bucket=${SUPABASE_EBOOKS_BUCKET:e-books-pdf}
app.jwt.secret=${JWT_SECRET:}
